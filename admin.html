<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27Busan｜住宿資料管理</title>

<style>
:root{
  --bg:#f5f7fb;--card:#fff;--line:#dfe3ea;--text:#1f2937;--sub:#6b7280;
  --primary:#2563eb;--danger:#dc2626;--soft:#eff6ff;--ok:#ecfdf5;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}
header{background:#111827;color:#fff;padding:22px 18px}
.wrap{width:min(1220px,calc(100% - 28px));margin:auto}
h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#cbd5e1;font-size:14px}
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;padding:16px 0;align-items:center
}
button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:9px 13px;
  font:inherit;
  cursor:pointer
}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.danger{color:var(--danger)}
.status{margin-left:auto;color:var(--sub);font-size:13px}
.map-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.map-tools button{padding:7px 10px}
.help{font-size:12px;color:var(--sub);line-height:1.55;margin-top:6px}
.layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:16px;
  padding-bottom:36px
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden
}
.panel-head{
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  font-weight:700
}
.list{max-height:calc(100vh - 190px);overflow:auto}
.item{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  cursor:pointer
}
.item:hover,.item.active{background:var(--soft)}
.item-title{font-weight:700;line-height:1.4}
.item-meta{font-size:12px;color:var(--sub);margin-top:4px}
.empty{padding:25px;color:var(--sub);text-align:center}
.form{padding:16px}
.section{margin-bottom:24px}
.section-title{
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--line);
  padding-bottom:7px;
  margin-bottom:12px
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
.field.full{grid-column:1/-1}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px
}
input,textarea,select{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  font:inherit;
  background:#fff;
  color:var(--text)
}
textarea{min-height:82px;resize:vertical}
.notice{
  display:block;
  background:var(--ok);
  color:#065f46;
  padding:10px 12px;
  border-radius:8px;
  line-height:1.55;
  margin-bottom:14px
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  border-top:1px solid var(--line);
  padding-top:15px
}

.toast-container{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none
}
.toast{
  min-width:260px;
  max-width:min(420px,calc(100vw - 36px));
  padding:12px 14px;
  border-radius:12px;
  background:#111827;
  color:#fff;
  box-shadow:0 14px 34px rgba(15,23,42,.22);
  display:flex;
  gap:9px;
  align-items:flex-start;
  line-height:1.45;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .2s ease,transform .2s ease
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
.toast.warning{background:#92400e}
.toast-icon{font-weight:800;line-height:1.45}
@media(max-width:560px){
  .toast-container{left:14px;right:14px;bottom:14px}
  .toast{min-width:0;max-width:none;width:100%}
}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .list{max-height:280px}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .status{width:100%;margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>🏨 27Busan 住宿資料管理</h1>
  </div>
</header>

<main class="wrap">

  <div class="toolbar">
    <button class="primary" id="btnNew">＋ 新增住宿</button>
    <button id="btnReload">重新讀取 hotels.json</button>
    <button id="btnResolveAll">批次補座標</button>
    <span class="status" id="status"></span>
  </div>

  <div class="layout">

    <aside class="panel">
      <div class="panel-head">住宿清單</div>
      <div class="list" id="hotelList"></div>
    </aside>

    <section class="panel">
      <div class="panel-head" id="formTitle">新增住宿</div>

      <form class="form" id="hotelForm">

        <div class="section">
          <div class="section-title">基本資料</div>

          <div class="grid">

            <div class="field">
              <label>編號 id</label>
              <input id="id" type="number" readonly>
            </div>

            <div class="field">
              <label>訂房平台 platform</label>
              <select id="platform">
                <option value="">請選擇</option>
                <option value="Airbnb">Airbnb</option>
                <option value="Booking">Booking</option>
                <option value="Agoda">Agoda</option>
                <option value="其他">其他</option>
              </select>
            </div>

            <div class="field full">
              <label>住宿名稱 name</label>
              <input id="name">
            </div>

            <div class="field full">
              <label>住宿副標題 title</label>
              <input id="title">
            </div>

            <div class="field full">
              <label>住宿簡介 desc</label>
              <textarea id="desc"></textarea>
            </div>

            <div class="field">
              <label>區域 area</label>
              <input id="area">
            </div>

            <div class="field">
              <label>評分 rating</label>
              <input id="rating" type="number" step="0.01">
            </div>

            <div class="field">
              <label>評論數 reviewCount</label>
              <input id="reviewCount" type="number">
            </div>

            <div class="field full">
              <label>訂房網址 bookingUrl</label>
              <input id="bookingUrl" type="url">
            </div>

          </div>
        </div>

        <div class="section">
          <div class="section-title">地圖位置</div>

          <div class="grid">

            <div class="field">
              <label>緯度 lat</label>
              <input id="lat" type="number" step="any">
            </div>

            <div class="field">
              <label>經度 lng</label>
              <input id="lng" type="number" step="any">
            </div>

            <div class="field full">
              <label>地圖網址 mapUrl</label>
              <input id="mapUrl" type="url" placeholder="可貼 https://maps.app.goo.gl/... 或完整 Google Maps 網址">
              <div class="map-tools">
                <button type="button" id="btnResolveMap">從 Google Maps 網址取得座標</button>
                <span id="mapResolveStatus" class="help"></span>
              </div>
              <div class="help">
                Airbnb 沒有精確地址時，可貼「附近地標」的 Google Maps 分享網址。
                取得的 lat/lng 會作為地圖上的參考位置。
              </div>
            </div>

          </div>
        </div>

        <div class="section">
          <div class="section-title">房型資訊</div>

          <div class="grid">

            <div class="field">
              <label>幾間臥室 bedrooms</label>
              <input id="bedrooms" type="number" step="0.5">
            </div>

            <div class="field full">
              <label>床數說明 bedDescription</label>
              <input id="bedDescription" placeholder="例如：3 張雙人床＋1 張沙發床">
            </div>

            <div class="field">
              <label>是否有廚房 hasKitchen</label>
              <select id="hasKitchen">
                <option value="">未確認</option>
                <option value="true">有</option>
                <option value="false">沒有</option>
              </select>
            </div>

            <div class="field">
              <label>是否有客廳 hasLivingRoom</label>
              <select id="hasLivingRoom">
                <option value="">未確認</option>
                <option value="true">有</option>
                <option value="false">沒有</option>
              </select>
            </div>

            <div class="field">
              <label>是否有電梯 hasElevator</label>
              <select id="hasElevator">
                <option value="">未確認</option>
                <option value="true">有</option>
                <option value="false">沒有</option>
              </select>
            </div>

          </div>
        </div>

        <div class="section">
          <div class="section-title">價格與取消政策</div>

          <div class="grid">

            <div class="field">
              <label>總價 totalPrice</label>
              <input id="totalPrice" type="number">
            </div>

            <div class="field">
              <label>住宿晚數 nights</label>
              <input id="nights" type="number">
            </div>

            <div class="field">
              <label>分攤人數 people</label>
              <input id="people" type="number">
            </div>

            <div class="field full">
              <label>取消政策 cancelPolicy</label>
              <textarea id="cancelPolicy"></textarea>
            </div>

          </div>
        </div>

        <div class="section">
          <div class="section-title">照片與補充資訊</div>

          <div class="grid">

            <div class="field full">
              <label>主照片 image</label>
              <input id="image" type="url">
            </div>

            <div class="field full">
              <label>其他照片 images</label>
              <textarea id="images" placeholder="每行一個圖片網址"></textarea>
            </div>

            <div class="field full">
              <label>優點 pros</label>
              <textarea id="pros" placeholder="每行一個"></textarea>
            </div>

            <div class="field full">
              <label>缺點 / 注意事項 cons</label>
              <textarea id="cons" placeholder="每行一個"></textarea>
            </div>

            <div class="field full">
              <label>備註 note</label>
              <textarea id="note"></textarea>
            </div>

          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary">儲存</button>
          <button type="button" id="btnDelete" class="danger">刪除這筆</button>
          <button type="button" id="btnCancel">取消編輯</button>
        </div>

      </form>
    </section>

  </div>
</main>
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>


<script>
let hotels = [];
let editingId = null;

const textFields = [
  "platform","name","title","desc","area",
  "bookingUrl","mapUrl","bedDescription",
  "cancelPolicy","image","note"
];

const numberFields = [
  "lat","lng","bedrooms",
  "rating","reviewCount","totalPrice","nights","people"
];

const booleanFields = [
  "hasKitchen","hasLivingRoom","hasElevator"
];

const arrayFields = [
  "images","pros","cons"
];


function showToast(message,type="success",duration=2600){
  const container = document.getElementById("toastContainer");
  if(!container) return;

  const icons = {success:"✓",error:"✕",warning:"!"};
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.setAttribute("role", type === "error" ? "alert" : "status");

  const icon = document.createElement("span");
  icon.className = "toast-icon";
  icon.textContent = icons[type] || "✓";

  const text = document.createElement("span");
  text.textContent = message;

  toast.append(icon,text);
  container.appendChild(toast);

  requestAnimationFrame(()=>toast.classList.add("show"));

  window.setTimeout(()=>{
    toast.classList.remove("show");
    window.setTimeout(()=>toast.remove(),220);
  },duration);
}

function nextId(){
  return hotels.length
    ? Math.max(...hotels.map(x=>Number(x.id)||0)) + 1
    : 1;
}

function linesToArray(value){
  return value
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function numberOrNull(id){
  const value = document.getElementById(id).value.trim();
  return value === "" ? null : Number(value);
}

function booleanOrNull(id){
  const value = document.getElementById(id).value;

  if(value === "true") return true;
  if(value === "false") return false;

  return null;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadHotels(){
  const status = document.getElementById("status");
  status.textContent = "讀取 hotels.json 中...";

  try{
    const res = await fetch("hotels.json?t=" + Date.now(),{cache:"no-store"});

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    hotels = await res.json();

    if(!Array.isArray(hotels)){
      throw new Error("hotels.json 最外層必須是陣列");
    }

    renderList();
    newHotel();

    status.textContent = `目前 ${hotels.length} 筆`;

  }catch(err){
    status.textContent = "讀取失敗：" + err.message;
  }
}

function extractCoordinatesFromUrl(rawUrl){
  if(!rawUrl) return null;

  let value = rawUrl;
  try{ value = decodeURIComponent(rawUrl); }catch(e){}

  let match = value.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"place"};

  try{
    const u = new URL(rawUrl);
    for(const key of ["query","q","ll","center"]){
      const candidate = u.searchParams.get(key);
      if(!candidate) continue;
      match = candidate.match(/(-?\d{1,2}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
      if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"query"};
    }
  }catch(e){}

  match = value.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"viewport"};

  return null;
}

async function resolveMapUrl(rawUrl){
  const local = extractCoordinatesFromUrl(rawUrl);
  if(local) return local;

  const res = await fetch("/resolve-map?url=" + encodeURIComponent(rawUrl),{cache:"no-store"});
  let data = {};
  try{ data = await res.json(); }catch(e){}

  if(!res.ok || !data.ok){
    throw new Error(data.message || `HTTP ${res.status}`);
  }

  return {lat:Number(data.lat),lng:Number(data.lng),source:data.source || "resolved"};
}

function applyResolvedPoint(point){
  document.getElementById("lat").value = point.lat;
  document.getElementById("lng").value = point.lng;
}

async function resolveCurrentMap(){
  const url = document.getElementById("mapUrl").value.trim();
  const status = document.getElementById("mapResolveStatus");

  if(!url){
    status.textContent = "請先貼 Google Maps 網址。";
    return;
  }

  status.textContent = "解析中...";
  try{
    const point = await resolveMapUrl(url);
    applyResolvedPoint(point);
    status.textContent = `已取得 ${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`;
  }catch(err){
    status.textContent = "解析失敗：" + err.message;
  }
}

async function resolveAllMissingCoordinates(){
  const status = document.getElementById("status");
  const oldHotels = hotels.map(h=>({...h}));
  const targets = hotels.filter(h =>
    h.mapUrl && (h.lat == null || h.lng == null || h.lat === "" || h.lng === "")
  );

  if(!targets.length){
    status.textContent = "沒有需要補座標的住宿。";
    return;
  }

  let success = 0;
  let failed = 0;

  for(let i=0;i<targets.length;i++){
    const h = targets[i];
    status.textContent = `批次解析座標 ${i+1}/${targets.length}：#${h.id} ${h.name || "未命名"}`;

    try{
      const point = await resolveMapUrl(h.mapUrl);
      h.lat = point.lat;
      h.lng = point.lng;
      success++;
    }catch(err){
      console.warn("座標解析失敗", h.id, h.mapUrl, err);
      failed++;
    }
  }

  if(success){
    try{
      await writeHotels();
    }catch(err){
      hotels = oldHotels;
      renderList();
      throw err;
    }
  }

  renderList();
  if(editingId != null) editHotel(editingId);
  status.textContent = `座標處理完成：成功 ${success} 筆，失敗 ${failed} 筆`;
}

async function verifyHotelsSaved(expected){
  try{
    const res = await fetch("hotels.json?t=" + Date.now(),{cache:"no-store"});
    if(!res.ok) return false;
    const saved = await res.json();
    return JSON.stringify(saved) === JSON.stringify(expected);
  }catch(err){
    return false;
  }
}

async function writeHotels(){
  const status = document.getElementById("status");
  status.textContent = "儲存中...";

  let primaryError = null;

  try{
    const res = await fetch("/save-hotels",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(hotels)
    });

    let data = {};
    try{
      data = await res.json();
    }catch(e){}

    if(!res.ok){
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    status.textContent = `已直接更新 hotels.json，共 ${hotels.length} 筆`;
    return;

  }catch(err){
    primaryError = err;
  }

  // POST 的回應若在檔案寫入後中斷，舊版會誤報「儲存失敗」。
  // 重新 GET 實際檔案；內容一致就視為成功。
  if(await verifyHotelsSaved(hotels)){
    status.textContent = `hotels.json 已更新（已重新讀取驗證），共 ${hotels.length} 筆`;
    return;
  }

  throw primaryError || new Error("儲存失敗");
}

function renderList(){
  const el = document.getElementById("hotelList");

  if(!hotels.length){
    el.innerHTML = '<div class="empty">目前沒有住宿資料</div>';
    return;
  }

  el.innerHTML = hotels
    .slice()
    .sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0))
    .map(h=>`
      <div class="item ${editingId===h.id ? "active" : ""}" data-id="${h.id}">
        <div class="item-title">
          #${h.id} ${escapeHtml(h.name || "未命名住宿")}
        </div>
        <div class="item-meta">
          ${escapeHtml(h.platform || "未填平台")} ・ ${escapeHtml(h.area || "未填區域")}
        </div>
      </div>
    `)
    .join("");

  el.querySelectorAll(".item").forEach(item=>{
    item.addEventListener("click",()=>{
      editHotel(Number(item.dataset.id));
    });
  });
}

function newHotel(){
  editingId = null;

  document.getElementById("hotelForm").reset();
  document.getElementById("id").value = nextId();

  document.getElementById("formTitle").textContent = "新增住宿";
  document.getElementById("btnDelete").style.display = "none";

  renderList();
}

function editHotel(id){
  const h = hotels.find(x=>Number(x.id)===Number(id));
  if(!h) return;

  editingId = h.id;

  document.getElementById("formTitle").textContent = `編輯住宿 #${h.id}`;
  document.getElementById("id").value = h.id;

  textFields.forEach(field=>{
    document.getElementById(field).value = h[field] ?? "";
  });

  numberFields.forEach(field=>{
    document.getElementById(field).value = h[field] ?? "";
  });

  booleanFields.forEach(field=>{
    const value = h[field];

    document.getElementById(field).value =
      value === true ? "true" :
      value === false ? "false" :
      "";
  });

  arrayFields.forEach(field=>{
    document.getElementById(field).value =
      Array.isArray(h[field]) ? h[field].join("\n") : "";
  });

  document.getElementById("btnDelete").style.display = "inline-block";

  renderList();
}

function collectForm(){

  let obj = {};

  if(editingId != null){
    const existing = hotels.find(x=>Number(x.id)===Number(editingId));

    if(existing){
      obj = {...existing};
    }
  }

  obj.id = Number(document.getElementById("id").value);

  textFields.forEach(field=>{
    obj[field] = document.getElementById(field).value.trim();
  });

  numberFields.forEach(field=>{
    obj[field] = numberOrNull(field);
  });

  booleanFields.forEach(field=>{
    obj[field] = booleanOrNull(field);
  });

  arrayFields.forEach(field=>{
    obj[field] = linesToArray(document.getElementById(field).value);
  });

  return obj;
}

document.getElementById("hotelForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const obj = collectForm();

  if(!obj.name){
    showToast("請至少填住宿名稱。","warning");
    return;
  }

  const oldHotels = hotels.map(h=>({...h}));

  if(editingId == null){
    hotels.push(obj);
  }else{
    const idx = hotels.findIndex(x=>Number(x.id)===Number(editingId));

    if(idx >= 0){
      hotels[idx] = obj;
    }
  }

  try{
    await writeHotels();
  }catch(err){
    hotels = oldHotels;
    renderList();
    showToast("儲存失敗：" + err.message,"error",4200);
    return;
  }

  // 寫入 hotels.json 成功後再更新畫面。
  // 後續畫面更新若出錯，不再誤報成「儲存失敗」。
  editingId = obj.id;

  try{
    renderList();
    editHotel(obj.id);
    document.getElementById("status").textContent =
      `已直接更新 hotels.json，共 ${hotels.length} 筆`;
    showToast(`已儲存：${obj.name || "住宿資料"}`);
  }catch(err){
    console.error("資料已儲存，但管理頁畫面更新失敗：", err);
    document.getElementById("status").textContent =
      "hotels.json 已儲存，管理頁畫面更新時發生錯誤";
    showToast("資料已儲存，但管理頁畫面更新失敗","warning",4200);
  }
});

document.getElementById("btnDelete").addEventListener("click",async()=>{
  if(editingId == null) return;

  const h = hotels.find(x=>Number(x.id)===Number(editingId));

  if(!confirm(`確定刪除「${h?.name || editingId}」？`)){
    return;
  }

  const oldHotels = [...hotels];

  hotels = hotels.filter(x=>Number(x.id)!==Number(editingId));

  try{
    await writeHotels();
    renderList();
    newHotel();
    showToast(`已刪除：${h?.name || "住宿資料"}`);
  }catch(err){
    hotels = oldHotels;
    showToast("刪除失敗：" + err.message,"error",4200);
  }
});

document.getElementById("btnNew").addEventListener("click",newHotel);
document.getElementById("btnCancel").addEventListener("click",newHotel);
document.getElementById("btnReload").addEventListener("click",loadHotels);
document.getElementById("btnResolveMap").addEventListener("click",resolveCurrentMap);
document.getElementById("btnResolveAll").addEventListener("click",async()=>{
  try{
    await resolveAllMissingCoordinates();
  }catch(err){
    showToast("批次補座標失敗：" + err.message,"error",4200);
  }
});

loadHotels();
</script>

</body>
</html>
