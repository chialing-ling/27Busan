<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27Busan｜住宿資料管理</title>

<style>
:root{
  --bg:#f5f7fb;--card:#fff;--line:#dfe3ea;--text:#1f2937;--sub:#6b7280;
  --primary:#2563eb;--danger:#dc2626;--soft:#eff6ff;--ok:#ecfdf5;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}
header{background:#111827;color:#fff;padding:22px 18px}
.wrap{width:min(1220px,calc(100% - 28px));margin:auto}
h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#cbd5e1;font-size:14px}
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;padding:16px 0;align-items:center
}
button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:9px 13px;
  font:inherit;
  cursor:pointer
}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.danger{color:var(--danger)}
.status{margin-left:auto;color:var(--sub);font-size:13px}
.map-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.map-tools button{padding:7px 10px}
.help{font-size:12px;color:var(--sub);line-height:1.55;margin-top:6px}
.layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:16px;
  padding-bottom:36px
}
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden
}
.panel-head{
  padding:13px 15px;
  border-bottom:1px solid var(--line);
  font-weight:700
}
.layout > aside.panel{
  position:sticky;
  top:14px;
  align-self:start;

  max-height:calc(100vh - 28px);

  display:flex;
  flex-direction:column;
}

/* 左邊標題固定 */
.layout > aside.panel .panel-head{
  flex:0 0 auto;
}

/* 清單自己滾動 */
.layout > aside.panel .list{
  flex:1;
  min-height:0;
  max-height:calc(100vh - 75px);
  overflow-y:auto;
}
.item{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  cursor:pointer
}
.item:hover,.item.active{background:var(--soft)}
.item-title{font-weight:700;line-height:1.4}
.item-meta{font-size:12px;color:var(--sub);margin-top:4px}
.empty{padding:25px;color:var(--sub);text-align:center}
.form{padding:16px}
.section{margin-bottom:24px}
.section-title{
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--line);
  padding-bottom:7px;
  margin-bottom:12px
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}
.field.full{grid-column:1/-1}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px
}
input,textarea,select{
  width:100%;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  font:inherit;
  background:#fff;
  color:var(--text)
}
textarea{min-height:82px;resize:vertical}
.notice{
  display:block;
  background:var(--ok);
  color:#065f46;
  padding:10px 12px;
  border-radius:8px;
  line-height:1.55;
  margin-bottom:14px
}
.actions{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:9000;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.96);
  box-shadow:0 14px 34px rgba(15,23,42,.18);
  backdrop-filter:blur(8px)
}
.actions button{white-space:nowrap}
.form{padding-bottom:92px}

#btnResolveMap{
  background:#0f766e;
  color:#fff;
  border-color:#0f766e
}
#btnResolveMap:hover{background:#115e59;border-color:#115e59}

.toast-container{
  position:fixed;
  right:18px;
  bottom:92px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none
}
.toast{
  min-width:260px;
  max-width:min(420px,calc(100vw - 36px));
  padding:12px 14px;
  border-radius:12px;
  background:#111827;
  color:#fff;
  box-shadow:0 14px 34px rgba(15,23,42,.22);
  display:flex;
  gap:9px;
  align-items:flex-start;
  line-height:1.45;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .2s ease,transform .2s ease
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
.toast.warning{background:#92400e}
.toast-icon{font-weight:800;line-height:1.45}
@media(max-width:560px){
  .toast-container{left:14px;right:14px;bottom:14px}
  .toast{min-width:0;max-width:none;width:100%}
}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .list{max-height:280px}
  .actions{left:14px;right:14px;bottom:14px;justify-content:stretch}
  .actions button{flex:1}
  .form{padding-bottom:104px}
  .toast-container{bottom:92px}
  .layout > aside.panel{
  position:static;
  max-height:none;
  display:block;
}

.layout > aside.panel .list{
  max-height:280px;
}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .status{width:100%;margin-left:0}
}
</style>
</head>

<main class="wrap">

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>


<script>
let hotels = [];
let editingId = null;
let currentType = "hotel";
const typeConfig = {
  hotel: {
    label: "住宿",
    icon: "🛌",
    platformLabel: "訂房平台 platform",
    bookingUrlLabel: "訂房網址 bookingUrl",
    platforms: [
      ["", "請選擇"],
      ["Airbnb", "Airbnb"],
      ["Booking", "Booking"],
      ["Agoda", "Agoda"],
      ["其他", "其他"]
    ]
  },

  attraction: {
    label: "景點",
    icon: "📍",
    platformLabel: "購票 / 預約平台 platform",
    bookingUrlLabel: "購票 / 官方網址 bookingUrl",
    platforms: [
      ["", "請選擇"],
      ["KKday", "KKday"],
      ["Klook", "Klook"],
      ["Naver Table", "Naver Table"],
      ["其他", "其他"]
    ]
  },

  restaurant: {
    label: "餐廳",
    icon: "🍽️",
    platformLabel: "訂位 / 查詢平台 platform",
    bookingUrlLabel: "訂位 / 店家網址 bookingUrl",
    platforms: [
      ["", "請選擇"],
      ["KKday", "KKday"],
      ["Klook", "Klook"],
      ["Naver Table", "Naver Table"],
      ["其他", "其他"]
    ]
  }
};

const textFields = [
  "platform",
  "name",
  "area",
  "bookingUrl",
  "mapUrl",
  "bedDescription",
  "cancelPolicy",
  "image",
  "note",

  "placeCategory",
  "priceInfo",
  "openingHours",
  "closedDays",
  "stayDuration"
];

const numberFields = [
  "lat","lng","bedrooms",
  "rating","ratingMax","reviewCount",
  "totalPrice","nights","people"
];

const booleanFields = [
  "hasKitchen",
  "hasLivingRoom",
  "hasElevator",
  "hasWasherDryer",
  "hasLuggageStorage",
  "reservationAvailable"
];

const arrayFields = [
  "images"
];


function showToast(message,type="success",duration=2600){
  const container = document.getElementById("toastContainer");
  if(!container) return;

  const icons = {success:"✓",error:"✕",warning:"!"};
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.setAttribute("role", type === "error" ? "alert" : "status");

  const icon = document.createElement("span");
  icon.className = "toast-icon";
  icon.textContent = icons[type] || "✓";

  const text = document.createElement("span");
  text.textContent = message;

  toast.append(icon,text);
  container.appendChild(toast);

  requestAnimationFrame(()=>toast.classList.add("show"));

  window.setTimeout(()=>{
    toast.classList.remove("show");
    window.setTimeout(()=>toast.remove(),220);
  },duration);
}

function nextId(){
  return hotels.length
    ? Math.max(...hotels.map(x=>Number(x.id)||0)) + 1
    : 1;
}

function linesToArray(value){
  return value
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function numberOrNull(id){
  const value = document.getElementById(id).value.trim();
  return value === "" ? null : Number(value);
}

function booleanOrNull(id){
  const value = document.getElementById(id).value;

  if(value === "true") return true;
  if(value === "false") return false;

  return null;
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadHotels(){
  const status = document.getElementById("status");
  status.textContent = `讀取${typeConfig[currentType].label}資料中...`;

  try{
    const res = await fetch(
      `/api/places?type=${currentType}`,
      {
        cache:"no-store"
      }
    );

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    const payload = await res.json();

    if(!payload.ok || !Array.isArray(payload.data)){
      throw new Error("API 回傳格式錯誤");
    }

    hotels = payload.data;

    renderList();
    newHotel();

    status.textContent = `目前 ${hotels.length} 筆`;

  }catch(err){
    status.textContent = "讀取失敗：" + err.message;
    showToast("讀取 D1 失敗：" + err.message, "error", 4200);
  }
}

function extractCoordinatesFromUrl(rawUrl){
  if(!rawUrl) return null;

  let value = rawUrl;
  try{ value = decodeURIComponent(rawUrl); }catch(e){}

  let match = value.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"place"};

  try{
    const u = new URL(rawUrl);
    for(const key of ["query","q","ll","center"]){
      const candidate = u.searchParams.get(key);
      if(!candidate) continue;
      match = candidate.match(/(-?\d{1,2}(?:\.\d+)?),\s*(-?\d{1,3}(?:\.\d+)?)/);
      if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"query"};
    }
  }catch(e){}

  match = value.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(match) return {lat:Number(match[1]),lng:Number(match[2]),source:"viewport"};

  return null;
}

async function resolveMapUrl(rawUrl){
  const local = extractCoordinatesFromUrl(rawUrl);
  if(local) return local;

  const res = await fetch("/api/admin/resolve-map?url=" + encodeURIComponent(rawUrl),{cache:"no-store"});
  let data = {};
  try{ data = await res.json(); }catch(e){}

  if(!res.ok || !data.ok){
    throw new Error(data.message || `HTTP ${res.status}`);
  }

  return {lat:Number(data.lat),lng:Number(data.lng),source:data.source || "resolved"};
}

function applyResolvedPoint(point){
  document.getElementById("lat").value = point.lat;
  document.getElementById("lng").value = point.lng;
}

async function resolveCurrentMap(){
  const url = document.getElementById("mapUrl").value.trim();
  const status = document.getElementById("mapResolveStatus");

  if(!url){
    status.textContent = "請先貼 Google Maps 網址。";
    return;
  }

  status.textContent = "解析中...";
  try{
    const point = await resolveMapUrl(url);
    applyResolvedPoint(point);
    status.textContent = `已取得 ${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}`;
  }catch(err){
    status.textContent = "解析失敗：" + err.message;
  }
}

async function resolveAllMissingCoordinates(){
  const status = document.getElementById("status");
  const selectedId = editingId;

  const targets = hotels.filter(h =>
    h.mapUrl &&
    (
      h.lat == null ||
      h.lng == null ||
      h.lat === "" ||
      h.lng === ""
    )
  );

  if(!targets.length){
    status.textContent =
  `沒有需要補座標的${typeConfig[currentType].label}。`;

showToast(
  `沒有需要補座標的${typeConfig[currentType].label}。`,
  "warning"
);
    return;
  }

  let success = 0;
  let failed = 0;

  for(let i = 0; i < targets.length; i++){
    const h = targets[i];

    status.textContent =
      `批次解析座標 ${i + 1}/${targets.length}：#${h.id} ${h.name || "未命名"}`;

    try{
      // 先解析 Google Maps
      const point = await resolveMapUrl(h.mapUrl);

      h.lat = point.lat;
      h.lng = point.lng;

      // 直接更新 D1
      const res = await fetch(
        `/api/admin/places/${h.id}`,
        {
          method:"PUT",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            ...h,
            type:currentType
          })
        }
      );

      let data = {};

      try{
        data = await res.json();
      }catch(e){}

      if(res.status === 401){
        throw new Error("登入已過期，請重新登入後台");
      }

      if(!res.ok || !data.ok){
        throw new Error(
          data.message || `HTTP ${res.status}`
        );
      }

      success++;

    }catch(err){
      console.warn(
        "座標處理失敗",
        h.id,
        h.mapUrl,
        err
      );

      failed++;
    }
  }

  // 全部處理後重新從 D1 讀一次
  await loadHotels();

  // 如果原本正在編輯某筆，盡量重新選回來
  if(
    selectedId != null &&
    hotels.some(h => Number(h.id) === Number(selectedId))
  ){
    editHotel(selectedId);
  }

  status.textContent =
    `座標處理完成：成功 ${success} 筆，失敗 ${failed} 筆`;

  if(failed === 0){
    showToast(`批次補座標完成：${success} 筆`);
  }else{
    showToast(
      `完成：成功 ${success} 筆，失敗 ${failed} 筆`,
      "warning",
      4200
    );
  }
}
function renderList(){
  const el = document.getElementById("hotelList");

  if(!hotels.length){
    el.innerHTML =  `<div class="empty">目前沒有${typeConfig[currentType].label}資料</div>`;
    return;
  }

  el.innerHTML = hotels
    .slice()
    .sort((a,b)=>(Number(a.id)||0)-(Number(b.id)||0))
    .map(h=>`
      <div class="item ${editingId===h.id ? "active" : ""}" data-id="${h.id}">
        <div class="item-title">
          #${h.id} ${escapeHtml(
    h.name || `未命名${typeConfig[currentType].label}`
  )}
        </div>
        <div class="item-meta">
          ${escapeHtml(h.area || "未填區域")}
        </div>
      </div>
    `)
    .join("");

  el.querySelectorAll(".item").forEach(item=>{
    item.addEventListener("click",()=>{
      editHotel(Number(item.dataset.id));
    });
  });
}

function newHotel(){
  editingId = null;

  document.getElementById("hotelForm").reset();
  document.getElementById("id").value = "";

  document.getElementById("formTitle").textContent =
  `新增${typeConfig[currentType].label}`;
  document.getElementById("btnDelete").style.display = "none";

  renderList();
}

function editHotel(id){
  const h = hotels.find(x=>Number(x.id)===Number(id));
  if(!h) return;

  editingId = h.id;

  document.getElementById("formTitle").textContent = `編輯${typeConfig[currentType].label} #${h.id}`;
  document.getElementById("id").value = h.id;

  textFields.forEach(field=>{
    document.getElementById(field).value = h[field] ?? "";
  });

  numberFields.forEach(field=>{
    document.getElementById(field).value = h[field] ?? "";
  });

  booleanFields.forEach(field=>{
    const value = h[field];

    document.getElementById(field).value =
      value === true ? "true" :
      value === false ? "false" :
      "";
  });

  arrayFields.forEach(field=>{
    document.getElementById(field).value =
      Array.isArray(h[field]) ? h[field].join("\n") : "";
  });

  document.getElementById("btnDelete").style.display = "inline-block";

  renderList();
}

function collectForm(){

  let obj = {};

  if(editingId != null){
    const existing = hotels.find(x=>Number(x.id)===Number(editingId));

    if(existing){
      obj = {...existing};
    }
  }

  obj.id = Number(document.getElementById("id").value);

  textFields.forEach(field=>{
    obj[field] = document.getElementById(field).value.trim();
  });

  numberFields.forEach(field=>{
    obj[field] = numberOrNull(field);
  });

  booleanFields.forEach(field=>{
    obj[field] = booleanOrNull(field);
  });

  arrayFields.forEach(field=>{
    obj[field] = linesToArray(document.getElementById(field).value);
  });

  return obj;
}

async function saveHotelToD1(obj){
  const isNew = editingId == null;

  const url = isNew
    ? "/api/admin/places"
    : `/api/admin/places/${editingId}`;

  const method = isNew ? "POST" : "PUT";

  const res = await fetch(url,{
    method,
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      ...obj,
      type:currentType
    })
  });

  let data = {};

  try{
    data = await res.json();
  }catch(e){}

  if(res.status === 401){
    throw new Error("登入已過期，請重新登入後台");
  }

  if(!res.ok || !data.ok){
    throw new Error(data.message || `HTTP ${res.status}`);
  }

  return data;
}
  
document.getElementById("hotelForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const obj = collectForm();

  if(!obj.name){
    showToast(
  `請至少填${typeConfig[currentType].label}名稱。`,
  "warning"
);
    return;
  }

  const isNew = editingId == null;
  const oldId = editingId;

  try{
    document.getElementById("status").textContent = "儲存到 D1 中...";

    const result = await saveHotelToD1(obj);

    const savedId = isNew
      ? result.id
      : oldId;

    await loadHotels();

    if(savedId != null){
      editHotel(Number(savedId));
    }

    document.getElementById("status").textContent =
      `已儲存到 D1，目前 ${hotels.length} 筆`;

    showToast(`已儲存：${obj.name}`);

  }catch(err){
    showToast(
      "儲存失敗：" + err.message,
      "error",
      4200
    );
  }
});

document.getElementById("btnDelete").addEventListener("click",async()=>{
  if(editingId == null) return;

  const id = editingId;
  const h = hotels.find(
    x => Number(x.id) === Number(id)
  );

  if(!confirm(`確定刪除「${h?.name || id}」？`)){
    return;
  }

  try{
    const res = await fetch(
      `/api/admin/places/${id}`,
      {
        method:"DELETE"
      }
    );

    let data = {};

    try{
      data = await res.json();
    }catch(e){}

    if(res.status === 401){
      throw new Error("登入已過期，請重新登入後台");
    }

    if(!res.ok || !data.ok){
      throw new Error(
        data.message || `HTTP ${res.status}`
      );
    }

    await loadHotels();

    showToast(
  `已刪除：${h?.name || typeConfig[currentType].label + "資料"}`
);

  }catch(err){
    showToast(
      "刪除失敗：" + err.message,
      "error",
      4200
    );
  }
});
