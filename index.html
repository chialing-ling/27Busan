<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>27Busan｜住宿比較</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;
  --primary:#2563eb;--primary-soft:#eff6ff;--good:#047857;--warn:#b45309;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif;
}
header{background:#111827;color:#fff;padding:26px 18px}
.wrap{width:min(1280px,calc(100% - 28px));margin:auto}
h1{margin:0;font-size:clamp(28px,5vw,42px)}
header p{margin:8px 0 0;color:#cbd5e1}
.toolbar{
  margin:18px 0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center
}
button,select{
  font:inherit;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px
}
button{cursor:pointer}
button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.count{margin-left:auto;color:var(--sub);font-size:13px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);
  gap:16px;
  align-items:start;
  padding-bottom:36px;
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06);
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease,transform .2s ease;
}
.card.selected-card{
  border:2px solid var(--primary);
  background:var(--primary-soft);
  box-shadow:0 12px 30px rgba(37,99,235,.18);
  transform:translateY(-2px);
}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-size:20px;font-weight:800;line-height:1.35}
.name.map-name{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.name.map-name:hover{color:var(--primary)}
.name.map-name:focus{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}
.meta{font-size:13px;color:var(--sub);margin-top:5px}
.platform{
  font-size:12px;padding:5px 8px;border-radius:999px;background:var(--primary-soft);
  color:var(--primary);font-weight:700;white-space:nowrap
}
.title{margin:12px 0 4px;font-weight:700}
.desc{font-size:14px;color:#4b5563;line-height:1.55}
.price-grid,.info-grid,.amenity-grid{display:grid;gap:8px;margin-top:12px}
.price-grid,.info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.amenity-grid{grid-template-columns:repeat(3,1fr)}
.box{background:#f8fafc;border-radius:10px;padding:10px;min-width:0}
.box small{display:block;color:var(--sub);font-size:11px;margin-bottom:4px}
.box strong{font-size:16px}
.amenity{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.yes{background:#ecfdf5;color:var(--good)}
.no{background:#fef2f2;color:#b91c1c}
.unknown{background:#f9fafb;color:var(--sub)}
.section{margin-top:13px}
.section-title{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.note,.cancel{white-space:pre-line;font-size:14px;line-height:1.6}
.cancel{background:#fff7ed;color:var(--warn);padding:9px 10px;border-radius:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions a{
  flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;font-weight:700;color:var(--text)
}
.actions a.primary{background:var(--primary);color:#fff;border-color:var(--primary)}

.map-panel{
  position:sticky;top:14px;background:#fff;border:1px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,.06)
}
.map-head{padding:13px 15px;border-bottom:1px solid var(--line)}
.map-head strong{display:block;margin-bottom:4px}
.map-head span{font-size:12px;color:var(--sub);line-height:1.5}
#map{height:680px;background:#e5e7eb}
.map-note{padding:10px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--sub);line-height:1.5}
.empty{padding:30px;text-align:center;color:var(--sub);background:#fff;border-radius:14px}
  .head-side{
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-end;
}

.vote-btn{
  border:1px solid #fecdd3;
  background:#fff;
  color:#be123c;
  font-weight:800;
  white-space:nowrap;
}

.vote-btn:hover{
  background:#fff1f2;
}

.vote-btn.voted{
  background:#fff1f2;
  border-color:#fb7185;
  color:#be123c;
}

.voter-btn{
  border-color:#bfdbfe;
  color:#1d4ed8;
  background:#eff6ff;
  font-weight:700;
}

.voter-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  place-items:center;
  padding:18px;
  background:rgba(15,23,42,.45);
}

.voter-modal-backdrop.show{
  display:grid;
}

.voter-modal{
  width:min(420px,100%);
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 24px 60px rgba(15,23,42,.25);
}

.voter-modal h2{
  margin:0 0 6px;
  font-size:22px;
}

.voter-modal p{
  margin:0 0 16px;
  color:var(--sub);
  font-size:14px;
  line-height:1.55;
}

.voter-modal select{
  width:100%;
  margin-bottom:12px;
}

.voter-modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

.voter-modal-actions .primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
/* =========================
   投票排行榜
========================= */

.ranking-modal{
  width:min(900px,100%);
  max-height:88vh;
  padding:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.ranking-header{
  flex:0 0 auto;
  padding:20px 22px 14px;
  border-bottom:1px solid var(--line);
  background:#fff;
}

.ranking-header-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}

.ranking-header h2{
  margin:0 0 5px;
}

.ranking-header p{
  margin:0;
}

.ranking-close{
  flex:0 0 auto;
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  font-size:22px;
  line-height:1;
}

.ranking-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:20px 22px 24px;
}


/* ---------- 前三名 ---------- */

.ranking-section-title{
  margin:0 0 14px;
  font-size:15px;
  font-weight:800;
}

.ranking-podium{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1.12fr)
    minmax(0,1fr);
  gap:12px;
  align-items:end;
  margin-bottom:28px;
}

.podium-card{
   min-width:0;
  border:1px solid var(--line);
  border-radius:16px 16px 8px 8px;
  padding:16px 14px 0;
  text-align:center;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.podium-card.rank-1{
  background:#fffbeb;
  border-color:#fcd34d;
  min-height:270px;
}

.podium-card.rank-2{
  background:#f8fafc;
  border-color:#cbd5e1;
  min-height:240px;
}

.podium-card.rank-3{
  background:#fff7ed;
  border-color:#fdba74;
  min-height:220px;
}

.podium-medal{
  font-size:34px;
  line-height:1;
  margin-bottom:9px;
}

.podium-name{
  font-size:16px;
  line-height:1.35;
  font-weight:800;
  word-break:break-word;

  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.podium-area{
  margin-top:5px;
  color:var(--sub);
  font-size:12px;
}

.podium-votes{
  margin:10px 0 14px;
  color:#be123c;
  font-size:18px;
  font-weight:800;
}

.podium-base{
  margin:0 -14px;
  padding:10px 8px;
  font-size:24px;
  font-weight:900;
}

.rank-1 .podium-base{
  padding-top:18px;
  padding-bottom:18px;
  background:#fbbf24;
  color:#fff;
}

.rank-2 .podium-base{
  padding-top:12px;
  padding-bottom:12px;
  background:#cbd5e1;
  color:#475569;
}

.rank-3 .podium-base{
  padding-top:8px;
  padding-bottom:8px;
  background:#fb923c;
  color:#fff;
}


/* ---------- 第 4 名以後 ---------- */

.ranking-rest{
  border-top:1px solid var(--line);
  padding-top:20px;
}

.ranking-rest-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

.ranking-card{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
}

.ranking-card-rank{
  flex:0 0 32px;
  font-size:20px;
  font-weight:900;
  text-align:center;
}

.ranking-card-info{
  flex:1;
  min-width:0;
}

.ranking-card-name{
  font-weight:800;
  line-height:1.35;
  word-break:break-word;
}

.ranking-card-area{
  margin-top:3px;
  color:var(--sub);
  font-size:12px;
}

.ranking-card-votes{
  flex:0 0 auto;
  white-space:nowrap;
  color:#be123c;
  font-weight:800;
}


/* ---------- 手機 ---------- */

@media(max-width:650px){

  .ranking-modal{
    width:100%;
    max-height:92vh;
  }

  .ranking-header{
    padding:16px;
  }

  .ranking-scroll{
    padding:16px;
  }

  /*
    手機不做高低頒獎台，
    改成前三名直向排行卡
  */
  .ranking-podium{
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:stretch;
  }

  .podium-card{
    display:grid;
    grid-template-columns:48px minmax(0,1fr) auto;
    grid-template-areas:
      "medal name votes"
      "medal area votes";
    gap:2px 10px;
    align-items:center;

    padding:11px 12px;
    text-align:left;
    border-radius:12px;
  }

  .podium-medal{
    grid-area:medal;
    margin:0;
    font-size:28px;
    text-align:center;
  }

  .podium-name{
    grid-area:name;
    font-size:15px;
  }

  .podium-area{
    grid-area:area;
    margin:0;
  }

  .podium-votes{
    grid-area:votes;
    margin:0;
    font-size:16px;
  }

  .podium-base{
    display:none;
  }

  .ranking-rest-grid{
    grid-template-columns:1fr;
  }
}
  
@media(max-width:1050px){
  .layout{grid-template-columns:1fr}
  .map-panel{position:static;order:-1}
  #map{height:360px}
}
@media(max-width:780px){
  .grid{grid-template-columns:1fr}
  .count{width:100%;margin-left:0}
}
@media(max-width:480px){
  .price-grid,.info-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>🛌🏻 27Busan 住宿比較</h1>
  </div>
</header>

<main class="wrap">

  <div class="toolbar">
    <button class="active" data-area="全部">全部</button>
    <div id="areaButtons" style="display:contents"></div>
    <span class="count" id="count"></span>
    <button
  class="voter-btn"
  id="btnVoter"
  type="button">
  ♡ 我要投票
</button>
    <button
  id="btnRanking"
  type="button">
  🏆 投票排行
</button>
  </div>

  <section class="layout">

    <div class="grid" id="list"></div>

    <aside class="map-panel">
      <div class="map-head">
        <strong>🗺️ 住宿位置</strong>
        <span>有填 lat / lng 的住宿才會顯示 Marker；點住宿標題可直接定位到地圖。</span>
      </div>

      <div id="map"></div>

      <div class="map-note">
        若尚未提供精確地址，可填附近商家的座標作為參考位置。
      </div>
    </aside>

  </section>
</main>
<!-- =========================
     投票者選擇視窗
========================= -->
<div
  class="voter-modal-backdrop"
  id="voterModalBackdrop"
  aria-hidden="true">

  <div class="voter-modal">

    <h2>你是誰？</h2>

    <p>
      只有想投票時才需要選名字。
      選一次後，這台裝置會記住你的身分。
    </p>

    <select id="voterSelect">
      <option value="">請選擇你的名字</option>
    </select>

    <div class="voter-modal-actions">

      <button
        type="button"
        id="btnVoterCancel">
        先不要
      </button>

      <button
        type="button"
        id="btnVoterConfirm"
        class="primary">
        開始投票
      </button>

    </div>

  </div>
</div>


<!-- =========================
     投票排行榜視窗
========================= -->
<div
  class="voter-modal-backdrop"
  id="rankingModalBackdrop"
  aria-hidden="true">

  <div class="voter-modal ranking-modal">

    <div class="ranking-header">

      <div class="ranking-header-row">

        <div>
          <h2>🏆 住宿投票排行</h2>
          <p>目前大家最想住的住宿</p>
        </div>

        <button
          type="button"
          class="ranking-close"
          id="btnRankingClose"
          aria-label="關閉排行榜">
          ×
        </button>

      </div>

    </div>


    <div class="ranking-scroll">

      <div class="ranking-section-title">
        👑 目前前三名
      </div>

      <div
        class="ranking-podium"
        id="rankingPodium">
      </div>


      <div class="ranking-rest">

        <div class="ranking-section-title">
          ☷ 其他住宿排名
        </div>

        <div
          class="ranking-rest-grid"
          id="rankingRest">
        </div>

      </div>

    </div>

  </div>
</div>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let hotels = [];
let area = "全部";
let sortMode = "id";
let map = null;
let markerLayer = null;
let markersByHotelId = new Map();
let voters = [];
let currentVoter = null;
let voteState = new Map();
let pendingVotePlaceId = null;

function money(v){
  return v == null ? "待補" : "NT$" + Number(v).toLocaleString("zh-TW");
}
function text(v,fallback="待補"){
  return v === null || v === undefined || v === "" ? fallback : v;
}
function amenity(value,label){
  if(value === true) return `<div class="amenity yes">✓ ${label}：有</div>`;
  if(value === false) return `<div class="amenity no">✕ ${label}：沒有</div>`;
  return `<div class="amenity unknown">? ${label}：未確認</div>`;
}
function info(label,value){
  return `<div class="box"><small>${label}</small><strong>${text(value)}</strong></div>`;
}
function safe(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function initMap(){
  if(typeof L === "undefined"){
    document.getElementById("map").innerHTML =
      '<div style="padding:24px;color:#6b7280">Leaflet 載入失敗。</div>';
    return;
  }

  map = L.map("map").setView([35.155,129.115],11);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  markerLayer = L.layerGroup().addTo(map);
}

function getHotelPoint(h){
  if(h.lat == null || h.lng == null) return null;

  const lat = Number(h.lat);
  const lng = Number(h.lng);

  if(!Number.isFinite(lat) || !Number.isFinite(lng)) return null;

  return {lat,lng};
}

function focusHotelOnMap(hotelId){
  const h = hotels.find(x=>Number(x.id)===Number(hotelId));
  if(!h || !map) return;

  const pt = getHotelPoint(h);
  if(!pt) return;

  const marker = markersByHotelId.get(String(h.id));
  const targetZoom = Math.max(map.getZoom(),16);

  map.flyTo([pt.lat,pt.lng],targetZoom,{
    animate:true,
    duration:0.7
  });

  if(marker){
    window.setTimeout(()=>marker.openPopup(),450);
  }

  if(window.matchMedia("(max-width: 1050px)").matches){
    document.querySelector(".map-panel")?.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  }
}

function focusCard(hotelId){
  document.querySelectorAll(".card").forEach(card=>{
    card.classList.remove("selected-card");
  });

  const card = document.querySelector(`.card[data-hotel-id="${hotelId}"]`);
  if(!card) return;

  card.classList.add("selected-card");

  card.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  window.setTimeout(()=>{
    card.classList.remove("selected-card");
  },4000);
}

function renderMap(result){
  if(!map || !markerLayer) return;

  markerLayer.clearLayers();
  markersByHotelId.clear();

  const bounds = [];

  result.forEach(h=>{
    const pt = getHotelPoint(h);
    if(!pt) return;

    const marker = L.marker([pt.lat,pt.lng]).addTo(markerLayer);
    markersByHotelId.set(String(h.id),marker);

    marker.bindPopup(`
      <strong>#${h.id ?? ""} ${safe(h.name || "未命名住宿")}</strong><br>
      ${safe(h.area || "")}<br>
      ${h.totalPrice != null ? "總價 " + money(h.totalPrice) : ""}
    `);

    marker.on("click",()=>{
      focusCard(h.id);
    });

    bounds.push([pt.lat,pt.lng]);
  });

  if(bounds.length){
    map.fitBounds(bounds,{padding:[28,28],maxZoom:15});
  }else{
    map.setView([35.155,129.115],11);
  }
}

async function loadVoters(){
  try{
    const res = await fetch(
      "/api/voters",
      {cache:"no-store"}
    );

    const payload = await res.json();

    if(!res.ok || !payload.ok){
      throw new Error(
        payload.message || `HTTP ${res.status}`
      );
    }

    voters = payload.data || [];

    const select =
      document.getElementById("voterSelect");

    select.innerHTML =
      '<option value="">請選擇你的名字</option>' +
      voters
        .map(v =>
          `<option value="${v.id}">
            ${safe(v.name)}
          </option>`
        )
        .join("");

  }catch(err){
    console.error(
      "讀取投票成員失敗：",
      err
    );
  }
}


async function loadCurrentVoter(){
  try{
    const res = await fetch(
      "/api/voter/me",
      {cache:"no-store"}
    );

    const payload = await res.json();

    if(res.ok && payload.ok){
      currentVoter = payload.voter || null;
    }

  }catch(err){
    currentVoter = null;
  }

  updateVoterButton();
}


async function loadVotes(){
  try{
    const res = await fetch(
      "/api/votes?type=hotel",
      {cache:"no-store"}
    );

    const payload = await res.json();

    if(!res.ok || !payload.ok){
      throw new Error(
        payload.message || `HTTP ${res.status}`
      );
    }

    currentVoter =
      payload.voter || currentVoter;

    voteState = new Map(
      (payload.data || []).map(x => [
        String(x.placeId),
        {
          count:Number(x.count || 0),
          votedByMe:Boolean(x.votedByMe)
        }
      ])
    );

    updateVoterButton();

  }catch(err){
    console.error(
      "讀取投票資料失敗：",
      err
    );
  }
}


function updateVoterButton(){
  const btn =
    document.getElementById("btnVoter");

  btn.textContent = currentVoter
    ? `👤 ${currentVoter.name}（切換）`
    : "♡ 我要投票";
}


function openVoterModal(placeId=null){
  pendingVotePlaceId = placeId;

  const select =
    document.getElementById("voterSelect");

  select.value = currentVoter?.id
    ? String(currentVoter.id)
    : "";

  document
    .getElementById("voterModalBackdrop")
    .classList.add("show");
}


function closeVoterModal(){
  document
    .getElementById("voterModalBackdrop")
    .classList.remove("show");

  pendingVotePlaceId = null;
}


async function selectVoter(){
  const voterId = Number(
    document.getElementById("voterSelect").value
  );

  if(!voterId){
    alert("請先選擇你的名字。");
    return;
  }

  const pending = pendingVotePlaceId;

  const res = await fetch(
    "/api/voter/select",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        voterId
      })
    }
  );

  const payload = await res.json();

  if(!res.ok || !payload.ok){
    alert(
      payload.message || "選擇身分失敗"
    );
    return;
  }

  currentVoter = payload.voter;

  closeVoterModal();

  await loadVotes();

  render();

  if(pending != null){
    await toggleVote(pending);
  }
}
function updateVoteButton(placeId){
  const btn = document.querySelector(
    `[data-vote-place-id="${placeId}"]`
  );

  if(!btn) return;

  const vote =
    voteState.get(String(placeId)) ||
    {
      count:0,
      votedByMe:false
    };

  btn.classList.toggle(
    "voted",
    vote.votedByMe
  );

  btn.textContent =
    `${vote.votedByMe ? "♥" : "♡"} ${vote.count}`;
}

async function toggleVote(placeId){

  // 還沒選身分
  if(!currentVoter){
    openVoterModal(placeId);
    return;
  }

  const key = String(placeId);

  const oldState =
    voteState.get(key) ||
    {
      count:0,
      votedByMe:false
    };

  // -------------------------
  // 先立即更新畫面
  // -------------------------
  const optimisticState = {
    votedByMe: !oldState.votedByMe,
    count:
      oldState.count +
      (oldState.votedByMe ? -1 : 1)
  };

  voteState.set(
    key,
    optimisticState
  );

  updateVoteButton(placeId);

  try{
    const res = await fetch(
      `/api/votes/${placeId}`,
      {
        method:"POST"
      }
    );

    const payload = await res.json();

    if(
      res.status === 401 ||
      payload.needsVoter
    ){
      // 回復原本狀態
      voteState.set(
        key,
        oldState
      );

      updateVoteButton(placeId);

      currentVoter = null;
      updateVoterButton();
      openVoterModal(placeId);

      return;
    }

    if(!res.ok || !payload.ok){
      throw new Error(
        payload.message ||
        `HTTP ${res.status}`
      );
    }

    // -------------------------
    // 用伺服器真實結果校正
    // -------------------------
    voteState.set(
      key,
      {
        count:Number(payload.count || 0),
        votedByMe:Boolean(payload.voted)
      }
    );

    updateVoteButton(placeId);

  }catch(err){

    // API 失敗就恢復
    voteState.set(
      key,
      oldState
    );

    updateVoteButton(placeId);

    alert(
      "投票失敗：" + err.message
    );
  }
}
  function openRanking(){

  const podium =
    document.getElementById("rankingPodium");

  const rest =
    document.getElementById("rankingRest");


  // -------------------------
  // 依照票數由高到低
  // 同票時照住宿 id
  // -------------------------
  const ranked = hotels
    .map(h=>{

      const vote =
        voteState.get(String(h.id)) ||
        {
          count:0,
          votedByMe:false
        };

      return {
        ...h,
        voteCount:Number(vote.count || 0)
      };

    })
    .sort((a,b)=>{

      if(b.voteCount !== a.voteCount){
        return b.voteCount - a.voteCount;
      }

      return Number(a.id) - Number(b.id);

    });


  // -------------------------
  // 沒有住宿
  // -------------------------
  if(!ranked.length){

    podium.innerHTML =
      '<div class="empty">目前沒有住宿資料</div>';

    rest.innerHTML = "";

    document
      .getElementById("rankingModalBackdrop")
      .classList.add("show");

    return;
  }


  // -------------------------
  // 前三名
  // -------------------------
  const first  = ranked[0] || null;
  const second = ranked[1] || null;
  const third  = ranked[2] || null;


  function podiumCard(h,rank){

    if(!h){
      return "";
    }

    const medal =
      rank === 1 ? "🥇" :
      rank === 2 ? "🥈" :
      "🥉";

    return `
      <div class="podium-card rank-${rank}">

        <div class="podium-medal">
          ${medal}
        </div>

        <div class="podium-name">
          #${h.id}
          ${safe(h.name || "未命名住宿")}
        </div>

        <div class="podium-area">
          ${safe(h.area || "區域待補")}
        </div>

        <div class="podium-votes">
          ♥ ${h.voteCount}
        </div>

        <div class="podium-base">
          ${rank}
        </div>

      </div>
    `;
  }


  /*
    桌機視覺：
       2      1      3

    CSS 會讓第 1 名底座最高
  */
  podium.innerHTML =
    podiumCard(second,2) +
    podiumCard(first,1) +
    podiumCard(third,3);


  // -------------------------
  // 第四名以後
  // -------------------------
  const others = ranked.slice(3);


  if(!others.length){

    rest.innerHTML =
      '<div class="empty">目前只有前三名住宿</div>';

  }else{

    rest.innerHTML = others
      .map((h,index)=>{

        const rank = index + 4;

        return `
          <div class="ranking-card">

            <div class="ranking-card-rank">
              ${rank}
            </div>

            <div class="ranking-card-info">

              <div class="ranking-card-name">
                #${h.id}
                ${safe(h.name || "未命名住宿")}
              </div>

              <div class="ranking-card-area">
                ${safe(h.area || "區域待補")}
              </div>

            </div>

            <div class="ranking-card-votes">
              ♥ ${h.voteCount}
            </div>

          </div>
        `;

      })
      .join("");

  }


  // -------------------------
  // 打開排行榜
  // -------------------------
  document
    .getElementById("rankingModalBackdrop")
    .classList.add("show");


  // 每次打開都從最上面開始
  const scroll =
    document.querySelector(
      "#rankingModalBackdrop .ranking-scroll"
    );

  if(scroll){
    scroll.scrollTop = 0;
  }
}

function closeRanking(){
  document
    .getElementById("rankingModalBackdrop")
    .classList.remove("show");
}

async function loadHotels(){
  try{
    const res = await fetch("/api/places?type=hotel", {
      cache:"no-store"
    });

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    const payload = await res.json();

    if(!payload.ok || !Array.isArray(payload.data)){
      throw new Error("API 回傳格式錯誤");
    }

    hotels = payload.data;

    buildAreaButtons();
    render();

  }catch(err){
    document.getElementById("list").innerHTML =
      `<div class="empty">
        住宿資料讀取失敗。<br><br>
        錯誤：${safe(err.message)}
      </div>`;
  }
}

function buildAreaButtons(){
  const holder = document.getElementById("areaButtons");
  const areas = [...new Set(hotels.map(h=>h.area).filter(Boolean))];

  holder.innerHTML = areas
    .map(a=>`<button data-area="${safe(a)}">${safe(a)}</button>`)
    .join("");

  document.querySelectorAll("[data-area]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      area = btn.dataset.area;

      document.querySelectorAll("[data-area]").forEach(x=>{
        x.classList.remove("active");
      });

      btn.classList.add("active");
      render();
    });
  });
}

function sortedFiltered(){
  let result = hotels.filter(h=>area==="全部" || h.area===area);
  result = [...result];

  if(sortMode==="priceAsc"){
    result.sort((a,b)=>(a.totalPrice ?? Infinity)-(b.totalPrice ?? Infinity));
  }else if(sortMode==="ratingDesc"){
    result.sort((a,b)=>(b.rating ?? -Infinity)-(a.rating ?? -Infinity));
  }else{
    result.sort((a,b)=>(a.id ?? 0)-(b.id ?? 0));
  }

  return result;
}

function render(){
  const result = sortedFiltered();

  document.getElementById("count").textContent = `共 ${result.length} 間`;

  const list = document.getElementById("list");

  if(!result.length){

    renderMap([]);
    return;
  }

  list.innerHTML = result.map(h=>{
    const hasMapPoint = !!getHotelPoint(h);

    return `
      <article class="card" data-hotel-id="${h.id}">

        <div class="head">
          <div>
            <div class="name${hasMapPoint ? " map-name" : ""}"
                 ${hasMapPoint ? `data-map-hotel-id="${h.id}" role="button" tabindex="0" title="在地圖上定位"` : ""}>#${h.id ?? ""} ${safe(h.name || "未命名住宿")}</div>
            <div class="meta">📍 ${safe(h.area || "區域待補")}</div>
          </div>

          <div class="head-side">

  <div class="platform">
    ${safe(h.platform || "平台未填")}
  </div>

  ${(()=>{
    const vote =
      voteState.get(String(h.id)) ||
      {
        count:0,
        votedByMe:false
      };

    return `
      <button
        type="button"
        class="vote-btn${vote.votedByMe ? " voted" : ""}"

        ${vote.votedByMe ? "♥" : "♡"}
        ${vote.count}

      </button>
    `;
  })()}

</div>
        </div>

        <div class="price-grid">
          ${info("總價",money(h.totalPrice))}
          ${info(
            "評分",
            h.rating != null
              ? `${h.rating}${h.ratingMax != null ? ` / ${h.ratingMax}` : ""}${h.reviewCount != null ? `（${h.reviewCount} 則）` : ""}`
              : null
          )}
        </div>

        <div class="info-grid">
          ${info("幾間臥室", h.bedrooms != null ? `${h.bedrooms} 間` : null)}
          ${info("床數說明", h.bedDescription || (h.beds != null ? `${h.beds} 張` : null))}
        </div>

        <div class="amenity-grid">
          ${amenity(h.hasKitchen,"廚房")}
          ${amenity(h.hasLivingRoom,"客廳")}
          ${amenity(h.hasElevator,"電梯")}
        </div>

        ${h.cancelPolicy ? `
          <div class="section">
            <div class="section-title">取消政策</div>
            <div class="cancel">${safe(h.cancelPolicy)}</div>
          </div>
        ` : ""}

        ${h.note ? `
          <div class="section">
            <div class="section-title">備註</div>
            <div class="note">${safe(h.note)}</div>
          </div>
        ` : ""}

        <div class="actions">
          ${h.bookingUrl ? `
            <a class="primary"
               href="${safe(h.bookingUrl)}"
               target="_blank"
               rel="noopener noreferrer">
              開啟訂房頁
            </a>
          ` : ""}

          ${h.mapUrl ? `
            <a href="${safe(h.mapUrl)}"
               target="_blank"
               rel="noopener noreferrer">
              📍 Google Maps
            </a>
          ` : ""}
        </div>

      </article>
    `;
  }).join("");

  renderMap(result);

  list.querySelectorAll("[data-map-hotel-id]").forEach(el=>{
    const locate = ()=>focusHotelOnMap(Number(el.dataset.mapHotelId));

    el.addEventListener("click",locate);
    el.addEventListener("keydown",e=>{
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        locate();
      }
    });
  });
  list
  .querySelectorAll("[data-vote-place-id]")
  .forEach(btn=>{

    btn.addEventListener("click",async e=>{
      e.preventDefault();
      e.stopPropagation();

      await toggleVote(
        Number(btn.dataset.votePlaceId)
      );
    });

  });
}
